name: Export UWP (Xbox sideload package)

# Dispara manualmente pela aba "Actions" do GitHub (web ou app mobile),
# ou automaticamente a cada push na branch main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: roda em Linux. Usa o Godot 3.5 headless para gerar o pacote UWP
  # "cru" (nao assinado) a partir do preset "UWP Xbox Series S" definido
  # em export_presets.cfg. Isso e o que a documentacao oficial do Godot
  # confirma ser possivel a partir de qualquer plataforma, nao so Windows.
  # ----------------------------------------------------------------------
  export_uwp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Exportar projeto para UWP
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "UWP Xbox Series S"
          use_godot_3: true
          use_preset_export_path: true

      - name: Localizar pacote UWP exportado
        id: find_appx
        shell: bash
        run: |
          appx="$(find "$GITHUB_WORKSPACE" -type f -name '*.appx' | head -n 1)"
          if [ -z "$appx" ]; then
            echo "Nenhum .appx encontrado depois da exportacao."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | tail -200
            exit 1
          fi
          echo "appx_path=$appx" >> "$GITHUB_OUTPUT"
          echo "Pacote encontrado: $appx"

      - name: Validar identidade e icones Xbox do pacote
        shell: bash
        run: |
          python3 - "${{ steps.find_appx.outputs.appx_path }}" <<'PY'
          import re
          import struct
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          package_path = sys.argv[1]
          expected_assets = {
              "Assets/StoreLogo.png": (50, 50),
              "Assets/Square44x44Logo.png": (44, 44),
              "Assets/Square71x71Logo.png": (71, 71),
              "Assets/Square150x150Logo.png": (150, 150),
              "Assets/Square310x310Logo.png": (310, 310),
              "Assets/Wide310x150Logo.png": (310, 150),
              "Assets/SplashScreen.png": (620, 300),
          }
          with zipfile.ZipFile(package_path) as package:
              manifest = ET.fromstring(package.read("AppxManifest.xml"))
              for asset_path, expected_size in expected_assets.items():
                  data = package.read(asset_path)
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"Not a PNG: {asset_path}")
                  actual_size = struct.unpack(">II", data[16:24])
                  if actual_size != expected_size:
                      raise SystemExit(f"Wrong size for {asset_path}: {actual_size}")

          foundation = "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          uap = "http://schemas.microsoft.com/appx/manifest/uap/windows10"
          identity = manifest.find(f"{{{foundation}}}Identity")
          if identity.attrib["Name"] != "AlyssonDaPaz.MegaManX816bit":
              raise SystemExit("Unexpected package identity")
          if identity.attrib["Publisher"] != "CN=AlyssonDaPaz":
              raise SystemExit("Alysson da Paz is not the package publisher")

          preset = open("export_presets.cfg", encoding="utf-8").read()
          parts = [re.search(rf"version/{name}=(\d+)", preset).group(1)
                   for name in ("major", "minor", "build", "revision")]
          expected_version = ".".join(parts)
          if identity.attrib["Version"] != expected_version:
              raise SystemExit(f"Manifest version {identity.attrib['Version']} != {expected_version}")

          visual = manifest.find(f".//{{{uap}}}VisualElements")
          tile = visual.find(f"{{{uap}}}DefaultTile")
          splash = visual.find(f"{{{uap}}}SplashScreen")
          expected_manifest_paths = {
              visual.attrib["Square44x44Logo"],
              visual.attrib["Square150x150Logo"],
              tile.attrib["Square71x71Logo"],
              tile.attrib["Square310x310Logo"],
              tile.attrib["Wide310x150Logo"],
              splash.attrib["Image"],
          }
          if any(not path.startswith("Assets\\") for path in expected_manifest_paths):
              raise SystemExit("A package visual still points outside the custom Assets directory")
          print(f"Validated {len(expected_assets)} Xbox identity images and version {expected_version}")
          PY

      - name: Subir o pacote nao assinado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: uwp-package-unsigned
          path: ${{ steps.find_appx.outputs.appx_path }}
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # JOB 2: roda em Windows. Pega o pacote gerado no job acima, cria um
  # certificado de teste autoassinado, e assina o .appx para permitir
  # sideload via Dev Mode no Xbox.
  # ----------------------------------------------------------------------
  sign_package:
    needs: export_uwp
    runs-on: windows-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar o pacote nao assinado
        uses: actions/download-artifact@v4
        with:
          name: uwp-package-unsigned
          path: UWP_Export

      - name: Criar certificado de teste autoassinado
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=AlyssonDaPaz" `
            -KeyUsage DigitalSignature `
            -FriendlyName "MegaManX8UWP Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "teste1234" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "MegaManX8Test.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "MegaManX8Test.cer"

      - name: Localizar o .appx gerado
        id: find_appx
        shell: pwsh
        run: |
          $appx = Get-ChildItem -Path "UWP_Export" -Filter "*.appx" -Recurse | Select-Object -First 1
          if (-not $appx) {
            Write-Error "Nenhum .appx encontrado em UWP_Export. Verifique se o job de export terminou com sucesso."
            exit 1
          }
          echo "appx_path=$($appx.FullName)" >> $env:GITHUB_OUTPUT

      - name: Reempacotar como MSIX assinavel
        id: repack_msix
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1
          $makeAppx = Join-Path $sdk.FullName "x64\makeappx.exe"
          if (-not (Test-Path $makeAppx)) {
            Write-Error "makeappx.exe nao encontrado no runner."
            exit 1
          }

          $repack = Join-Path $PWD "repack"
          $msix = Join-Path $PWD "MegaManX8-16bit.msix"
          if (Test-Path $repack) { Remove-Item -LiteralPath $repack -Recurse -Force }
          New-Item -ItemType Directory -Path $repack | Out-Null

          tar -xf "${{ steps.find_appx.outputs.appx_path }}" -C $repack
          Remove-Item -LiteralPath (Join-Path $repack "AppxBlockMap.xml") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $repack "[Content_Types].xml") -Force -ErrorAction SilentlyContinue

          $assetSource = Join-Path $PWD "uwp_assets"
          $assetTarget = Join-Path $repack "Assets"
          Copy-Item -Path (Join-Path $assetSource "*.png") -Destination $assetTarget -Force
          Get-ChildItem -LiteralPath $assetSource -Filter "*.png" | ForEach-Object {
            $target = Join-Path $assetTarget $_.Name
            if ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash) {
              throw "Falha ao copiar a identidade visual UWP: $($_.Name)"
            }
          }

          & $makeAppx pack /d $repack /p $msix /o
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msix)) {
            Write-Error "MakeAppx repack falhou."
            exit 1
          }
          echo "msix_path=$msix" >> $env:GITHUB_OUTPUT

      - name: Assinar o pacote
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe nao encontrado. O Windows SDK pode nao estar no runner; veja a secao de troubleshooting do tutorial."
            exit 1
          }
          & $signtool.FullName sign /fd SHA256 /a /f "MegaManX8Test.pfx" /p "teste1234" "${{ steps.repack_msix.outputs.msix_path }}"

      - name: Validar arte final dentro do MSIX
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = [System.IO.Compression.ZipFile]::OpenRead("${{ steps.repack_msix.outputs.msix_path }}")
          try {
            Get-ChildItem -LiteralPath "uwp_assets" -Filter "*.png" | ForEach-Object {
              $entry = $package.GetEntry("Assets/$($_.Name)")
              if (-not $entry) { throw "Icone ausente no MSIX: $($_.Name)" }
              $memory = [System.IO.MemoryStream]::new()
              try {
                $stream = $entry.Open()
                try { $stream.CopyTo($memory) } finally { $stream.Dispose() }
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try {
                  $packageHash = [System.BitConverter]::ToString($sha.ComputeHash($memory.ToArray())).Replace("-", "")
                } finally { $sha.Dispose() }
              } finally { $memory.Dispose() }
              $sourceHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              if ($packageHash -ne $sourceHash) { throw "Arte incorreta no MSIX: $($_.Name)" }
            }
          } finally {
            $package.Dispose()
          }
          Write-Host "Os 7 assets UWP/Xbox correspondem aos PNGs do X."

      - name: Subir pacote assinado + certificado
        uses: actions/upload-artifact@v4
        with:
          name: uwp-package-signed-for-sideload
          path: |
            ${{ steps.repack_msix.outputs.msix_path }}
            MegaManX8Test.cer
          if-no-files-found: error
